name: release

# The plugin builds standalone: the SDK arrives through the git bridge
# in Cargo.toml (crates.io once published), so the job only checks out
# this repository, builds the DLL, assembles the package, and attaches
# the zip to the GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the DLL
        run: cargo build --release --locked
      - name: Assemble the plugin package
        run: python tools/assemble_pkg.py
      - name: Zip the package
        run: Compress-Archive -Path target/plugin-pkg/* -DestinationPath eu4-dynamic-trade-blackhole-${{ github.ref_name }}.zip
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: eu4-dynamic-trade-blackhole-${{ github.ref_name }}.zip
          generate_release_notes: true
