[package]
name = "foch-plugin-trade-blackhole"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
homepage = "https://github.com/Acture/foch"
repository = "https://github.com/Acture/foch"
description = "Dynamic trade-topology EU4 plugin for the Foch native host"
publish = false

[lib]
crate-type = ["cdylib"]

# Literal values (no .workspace inheritance) follow the
# tree-sitter-paradox submodule convention; the SDK arrives from
# crates.io, so a standalone clone builds on its own.
[dependencies]
foch-plugin-sdk = "0.0.1"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.145"
