[package]
name = "foch-plugin-trade-blackhole"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
homepage = "https://github.com/Acture/foch"
repository = "https://github.com/Acture/foch"
description = "Dynamic trade-topology EU4 plugin for the Foch native host"
publish = false

[lib]
crate-type = ["cdylib"]

# Mounted inside the Foch checkout (plugins/eu4-dynamic-trade-blackhole),
# the ABI resolves through the workspace; a standalone clone cannot build
# the DLL by design. Literal values (no .workspace inheritance) follow
# the tree-sitter-paradox submodule convention.
[dependencies]
foch-plugin-sdk = "0.0.1"

# Standalone (this file is the workspace root) the SDK resolves from
# the Foch repository until the crate lands on crates.io; inside the
# Foch workspace a member's patch section is ignored and the root's
# [patch.crates-io] redirects to the local member.
[patch.crates-io]
foch-plugin-sdk = { git = "https://github.com/Acture/foch.git", branch = "master" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.145"
